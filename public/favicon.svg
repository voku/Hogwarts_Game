<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D3A625;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="#0E1A40"/>
  <!-- Castle Tower -->
  <rect x="35" y="40" width="30" height="40" fill="url(#goldGrad)"/>
  <!-- Tower Top -->
  <polygon points="50,15 30,40 70,40" fill="url(#goldGrad)"/>
  <!-- Windows -->
  <rect x="42" y="50" width="6" height="8" fill="#0E1A40"/>
  <rect x="52" y="50" width="6" height="8" fill="#0E1A40"/>
  <rect x="42" y="62" width="6" height="8" fill="#0E1A40"/>
  <rect x="52" y="62" width="6" height="8" fill="#0E1A40"/>
  <!-- Door -->
  <rect x="45" y="72" width="10" height="8" fill="#740001"/>
  <!-- Stars -->
  <circle cx="20" cy="20" r="2" fill="#FFD700"/>
  <circle cx="80" cy="25" r="2" fill="#FFD700"/>
  <circle cx="15" cy="70" r="1.5" fill="#FFD700"/>
  <circle cx="85" cy="65" r="1.5" fill="#FFD700"/>
</svg>
