<!DOCTYPE html>
<html lang="de">

    <title>Hogwarts Trials</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              hogwarts: {
                red: '#740001',
                gold: '#D3A625',
                dark: '#0E1A40',
                green: '#1A472A',
                silver: '#5D5D5D',
                parchment: '#F0E6D2',
                parchmentDark: '#E6DCC3'
              }
            },
            fontFamily: {
              serif: ['"Crimson Text"', 'Georgia', 'serif'],
              cinzel: ['"Cinzel"', 'serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #1a1a1a;
        font-family: 'Crimson Text', serif;
      }
      .parchment-texture {
        background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
        background-color: #F0E6D2;
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
    </style>
